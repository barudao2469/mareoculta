function netError(e){return ({PROFILE_CONFLICT:'Outra aba ou sessão alterou a sua conta. Recarregue para evitar sobrescrever o progresso.',TANK_FULL:'Aquário lotado. Nenhum peixe foi removido.',NOT_YOUR_FISH_OR_EXPIRED:'O peixe já saiu do tanque ou pertence a outro jogador.',FISH_NOT_FOUND:'A captura não está mais disponível.'})[e?.message]||e?.message||String(e);}
function failOnline(e){online.failed=true;online.ready=false;status('⚠ Offline');gate('Sincronização interrompida',`<p>${escapeHtml(netError(e))}</p><p>O jogo foi pausado para não sobrescrever o progresso. Uma falha de conexão pode impedir a gravação das ações mais recentes.</p><button id="netReload" class="primary">Recarregar do servidor</button>`);$('netReload').onclick=()=>location.reload();}
function applyRemote(data,full=false){online.offset=Number(data.now_ms)-Date.now();online.revision=Number(data.revision);online.nick=data.nickname;let old=JSON.stringify(state.aquarium);if(full){state={...fresh(),...data.state,aquarium:data.aquarium||[]};normalize();player.x=Math.max(25,Math.min(W-25,Number(state.pos?.x)||PORT.x));player.y=Math.max(30,Math.min(H-30,Number(state.pos?.y)||PORT.y));player.vx=player.vy=0;ensureWaterPosition();ensureContracts();resize();render()}else{for(let it of data.returned||[]){if(!state.storage.some(x=>x.uid===it.uid))state.storage.push(it)}state.aquarium=data.aquarium||[];if(old!==JSON.stringify(state.aquarium)&&!online.busy){if(modalKind==='aquarium')openAquarium();if(modalKind==='donate')openDonate();}if(data.returned?.length){toast(`${data.returned.length} peixe(s) devolvido(s) ao armazém.`);if(modalKind==='storage')openStorage()}}online.lastSync=Date.now();}
async function rpcSync(action='sync',uid=null,load=false){let {data,error}=await online.client.rpc('mare_sync',{p_revision:load?null:online.revision,p_state:load?null:snapshot(),p_action:action,p_uid:uid});if(error)throw error;if(!data||!Array.isArray(data.aquarium))throw Error('Resposta inválida do servidor.');applyRemote(data,load||action!=='sync');return data;}
function syncOnline(){if(!online.ready||online.busy||online.pending||online.failed)return;online.pending=rpcSync().catch(failOnline).finally(()=>online.pending=null);}
async function aquariumAction(action,uid){if(!nearPort()||fishing)return;if(!online.enabled){localLoans();if(action==='deposit'){let i=state.items.findIndex(x=>x.uid===uid);if(i<0||state.aquarium.length>=15)return toast('Aquário lotado ou captura indisponível.');let now=gameNow();state.aquarium.push({...state.items.splice(i,1)[0],donatedAt:now,expiresAt:monthLater(now)});log('Emprestou um peixe ao aquário.')}else{let i=state.aquarium.findIndex(x=>x.uid===uid);if(i<0)return;state.storage.push(cleanLoan(state.aquarium.splice(i,1)[0]));toast('Peixe devolvido ao armazém.')}save();render();action==='deposit'?openDonate():openAquarium();return;}
 if(!online.ready||online.busy)return;online.busy=true;gate('Aquário municipal','<p>Confirmando empréstimo com o servidor…</p>');try{if(online.pending)await online.pending;if(online.failed)return;await rpcSync(action,uid);toast(action==='deposit'?'Peixe colocado em exposição por um mês.':'Peixe devolvido ao armazém.');$('onlineGate').hidden=true;action==='deposit'?openDonate():openAquarium();}catch(e){if(['TANK_FULL','NOT_YOUR_FISH_OR_EXPIRED','FISH_NOT_FOUND'].includes(e.message)){$('onlineGate').hidden=true;toast(netError(e));}else failOnline(e)}finally{online.busy=false;}}
function depositFish(it){if(!nearPort()||!it||species(it.id).rarity<0)return;if(state.aquarium.length>=15)return toast('Aquário lotado.');if(confirm(`Emprestar ${species(it.id).name} por um mês? Você poderá retirar antes do prazo.`))aquariumAction('deposit',it.uid);}
function withdrawFish(i){let it=state.aquarium[i];if(!it||!ownLoan(it)||!nearPort())return;if(confirm('Retirar este peixe e devolver ao seu armazém?'))aquariumAction('withdraw',it.uid);}
function authScreen(msg=''){gate('Entre no oceano compartilhado',`<p>Entre com sua conta ou crie uma nova. O piloto online começa com uma conta nova e independente do progresso offline.</p>${msg?`<p class="notice">${escapeHtml(msg)}</p>`:''}<form id="authForm"><label>Apelido (apenas cadastro)<input id="nick" maxlength="24" placeholder="Capitão…" autocomplete="nickname"></label><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><div class="authbuttons"><button class="primary" type="submit" value="login">Entrar</button><button type="submit" value="register">Criar conta</button></div></form><p class="tiny muted">Piloto fechado: não publique para desconhecidos até a validação da economia no servidor.</p>`);$('authForm').onsubmit=async e=>{e.preventDefault();let reg=e.submitter?.value==='register',email=$('email').value.trim(),password=$('password').value,nick=$('nick').value.trim();if(reg&&!nick){toast('Informe um apelido.');return}let buttons=[...$('authForm').querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);try{let result=reg?await online.client.auth.signUp({email,password,options:{data:{nickname:nick},emailRedirectTo:location.origin+location.pathname}}):await online.client.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(!result.data.session){authScreen('Confirme seu e-mail e depois faça login.');return}await enterOnline(result.data.session);}catch(e){authScreen(netError(e));}};}
async function enterOnline(session){online.user=session.user;gate('Carregando seu pescador','<p>Sincronizando inventário e aquário…</p>');try{await rpcSync('sync',null,true);await online.client.realtime.setAuth(session.access_token);joinOcean();online.ready=true;online.failed=false;$('onlineGate').hidden=true;status('● Conectando');$('logScope').textContent='ONLINE';syncOnline();}catch(e){failOnline(e)}}
async function initOnline(){if(!online.enabled){status('○ Local');localLoans();save();render();return}gate('Conectando ao servidor','<p>Iniciando o acesso…</p>');try{if(!window.supabase?.createClient)await new Promise((resolve,reject)=>{let el=document.createElement('script');el.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';el.onload=resolve;el.onerror=()=>reject(Error('Não foi possível carregar a biblioteca Supabase. Confira sua conexão.'));document.head.append(el)});if(!window.supabase?.createClient)throw Error('Biblioteca Supabase indisponível.');online.client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{storageKey:'mare-auth-v1'},realtime:{params:{eventsPerSecond:5}}});let {data,error}=await online.client.auth.getSession();if(error)throw error;if(data.session)await enterOnline(data.session);else authScreen();}catch(e){failOnline(e)}}
function openOnlineInfo(){if(fishing)return;if(!online.enabled){openModal('Multiplayer · configuração','<p>Este arquivo ainda está em modo local. Configure a Project URL e a Publishable Key no início do JavaScript e execute o SQL fornecido no Supabase.</p>','online');return}openModal('Oceano compartilhado',`<p>Conta: <b>${escapeHtml(online.nick)}</b></p><p>${online.connected?'Conectado ao oceano':'Reconectando ao oceano'} · ${online.roster.size||1} pescador(es) online</p><p>Última sincronização: ${online.lastSync?loanDate(online.lastSync):'aguardando'}</p><p class="notice">Piloto fechado: as capturas e a economia ainda são calculadas no navegador.</p><button id="logoutBtn" class="danger">Salvar e sair</button>`,'online');$('logoutBtn').onclick=async()=>{if(online.busy)return;online.busy=true;gate('Saindo','<p>Salvando seu progresso…</p>');try{if(online.pending)await online.pending;if(online.failed)return;await rpcSync();online.ready=false;if(online.channel)await online.client.removeChannel(online.channel);await online.client.auth.signOut();location.reload()}catch(e){failOnline(e)}finally{online.busy=false}};}
function joinOcean(){let ch=online.client.channel('mare-oceano-v1',{config:{private:true,broadcast:{self:false},presence:{key:online.user.id}}});online.channel=ch;ch.on('presence',{event:'sync'},()=>{online.roster=new Map(Object.entries(ch.presenceState()).map(([id,v])=>[id,String(v[0]?.nick||'Pescador').slice(0,24)]));for(let id of online.peers.keys())if(!online.roster.has(id))online.peers.delete(id)}).on('broadcast',{event:'boat'},({payload:p})=>{if(!p||p.id===online.user.id||!online.roster.has(p.id)||![p.x,p.y,p.angle,p.moving].every(Number.isFinite)||p.x<0||p.x>W||p.y<0||p.y>H)return;let old=online.peers.get(p.id),idx=(n,defs)=>Number.isInteger(n)&&defs[n]?n:0;online.peers.set(p.id,{id:p.id,nick:online.roster.get(p.id),x:old?.x??p.x,y:old?.y??p.y,angle:old?.angle??p.angle,tx:p.x,ty:p.y,ta:p.angle,moving:Math.max(0,Math.min(1,p.moving)),fishing:!!p.fishing,boat:idx(p.boat,boatDefs),paint:idx(p.paint,paintDefs),trail:idx(p.trail,trailDefs),flag:idx(p.flag,flagDefs),gear:{motor:Math.max(0,Math.min(2,Number(p.motor)||0))},level:Math.max(1,Math.min(50,Number(p.level)||1)),title:String(p.title||'').slice(0,45),seen:performance.now()})}).subscribe(async s=>{online.connected=s==='SUBSCRIBED';if(online.connected){await ch.track({nick:online.nick});status('● Online')}else status('↻ Rede')});}
let lastBroadcast=0;function netTick(now,dt,moving){if(!online.enabled)return;for(let [id,p] of online.peers){if(now-p.seen>12000){online.peers.delete(id);continue}let k=Math.min(1,dt*10);if(Math.hypot(p.tx-p.x,p.ty-p.y)>700){p.x=p.tx;p.y=p.ty}else{p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k}p.angle+=Math.atan2(Math.sin(p.ta-p.angle),Math.cos(p.ta-p.angle))*k;}if(!online.connected||!online.ready||now-lastBroadcast<(moving||fishing?200:1000))return;lastBroadcast=now;online.channel.send({type:'broadcast',event:'boat',payload:{id:online.user.id,x:player.x,y:player.y,angle:player.angle,moving:Number(moving),fishing:!!fishing,boat:state.boat,paint:state.paint,trail:state.trail,flag:state.flag,motor:state.gear.motor,level:state.level,title:state.title||careerTitles.filter(x=>x[0]<=state.level).at(-1)[1]}}).catch(()=>{});}
function drawPeers(c,t){if(!online.enabled)return;for(let p of online.peers.values()){if(!visible(p.x,p.y,100))continue;drawBoat(c,t,p.moving,p,p,p.fishing);c.save();c.font='bold 12px system-ui';c.textAlign='center';let name=p.nick+' · Nv. '+p.level,w=Math.min(260,c.measureText(name).width+16);rr(c,p.x-w/2,p.y-59,w,19,5,'#102c37e8');c.fillStyle='#e9f8f1';c.fillText(name,p.x,p.y-45,w-8);if(p.title){c.font='10px system-ui';c.fillStyle='#ffe0a5';c.fillText(p.title,p.x,p.y-30,220)}c.restore();}}

function openProfile(){checkAchievements();let l=levelInfo(),titles=[...careerTitles.filter(x=>x[0]<=l.level).map(x=>x[1]),...achDefs.filter((a,i)=>state.achievements[i]).map(a=>a[1])];openModal('Carreira do pescador',`<button class="small" data-act="more">← Menu</button><h3>Nível ${l.level} · ${fmt(state.xp)} XP total</h3><div class="progressline"><i style="width:${l.level===50?100:100*l.progress/l.need}%"></i></div><small>${l.level===50?'Nível máximo':fmt(l.progress)+' / '+fmt(l.need)+' XP para o próximo nível'}</small><h3>Títulos disponíveis</h3>${titles.map((t,i)=>`<button class="small" data-act="title" data-index="${i}" ${state.title===t?'disabled':''}>${t}</button>`).join(' ')}${careerRewardHtml(l.level)}<h3>Conquistas</h3>${achDefs.map(([k,n,v],i)=>`<div class="listrow"><span>${state.achievements[i]?'★':'☆'}</span><div class="grow"><b>${n}</b><small>${Math.min(v,achievementValue(k))}/${v}</small></div></div>`).join('')}`,'profile')}
function openMore(){openModal('Diário do pescador',`<div class="portgrid">${[['profile','★','Carreira'],['relics','◇','Relíquias'],['contracts','▤','Contratos'],['baits','◈','Iscas'],['boats','⚓','Estaleiro'],['settings','▣','Salvamento'],['help','?','Controles']].map(([a,i,n])=>`<button class="porttile" data-act="${a}"><span>${i}</span><b>${n}</b></button>`).join('')}</div><p class="notice">Compras e resgates apenas no porto. Previsão: ${weatherNow().name} · clima atualizado a cada 20 minutos.</p>`,'more')}
function extraActions(b){let i=Number(b.dataset.index);return {graphics:()=>{state.graphics=i===0?0:1;resize();save();openSettings()},more:openMore,profile:openProfile,relics:openRelics,contracts:openContracts,baits:openBaits,boats:openBoats,settings:openSettings,equipbait:()=>{if(fishing||!baitDefs[i]||i&&!state.baits[i])return;state.bait=i;save();openBaits()},buybait:()=>{let d=baitDefs[i];if(!nearPort()||!i||!d||state.money<d.price)return;state.money-=d.price;state.baits[i]=(state.baits[i]||0)+1;save();render();openBaits()},customize:()=>{let k=b.dataset.kind,config={boat:[boatDefs,'boats'],paint:[paintDefs,'paints'],trail:[trailDefs,'trails'],flag:[flagDefs,'flags']}[k];if(!nearPort()||!config||!config[0][i])return;let [defs,list]=config,d=defs[i];if(k==='boat'&&state.items.length>([24,36,60][state.gear.box]+d.cargo+careerCargo())){toast('Esvazie o inventário antes de trocar de barco.');return}if(!state[list].includes(i)){if(d.unlock||state.money<d.price)return;state.money-=d.price;state[list].push(i)}state[k]=i;save();render();openBoats()},claim:()=>{let old=state.contractDay;ensureContracts();let c=state.contracts[i];if(old!==state.contractDay||!nearPort()||!c||c.claimed||c.progress<c.goal){openContracts();return}c.claimed=true;state.money+=c.reward;state.stats.contracts++;addXP(100);save();render();openContracts()},title:()=>{let l=levelInfo(),titles=[...careerTitles.filter(x=>x[0]<=l.level).map(x=>x[1]),...achDefs.filter((a,i)=>state.achievements[i]).map(a=>a[1])];if(titles[i])state.title=titles[i];save();updateProfile();openProfile()}}}
function drawBoatExtras(c,bd,t,profile=state){if(profile.boat>0){rr(c,-10,-20,20,12,3,bd.color);rr(c,-7,-18,14,6,2,'#a6cbd4');if(profile.boat===2)rr(c,-13,8,26,10,2,'#ad946c');if(profile.boat===4){c.beginPath();c.moveTo(-3,-20);c.lineTo(-3,5);c.lineTo(14,5);c.closePath();c.fillStyle='#f7eee0';c.fill()}}let flag=flagDefs[profile.flag];if(flag.color){c.strokeStyle='#e7dbbb';c.lineWidth=1.6;c.beginPath();c.moveTo(-9,-12);c.lineTo(-9,-35);c.stroke();c.fillStyle=flag.color;c.beginPath();c.moveTo(-9,-35);c.lineTo(10,-32+Math.sin(t*6)*2);c.lineTo(-9,-23);c.closePath();c.fill();c.fillStyle='#fff3c7';c.font='8px sans-serif';c.fillText(flag.symbol,-5,-27)}}
function drawLighthouse(c,t){if(!visible(LIGHT.x,LIGHT.y,400))return;let {x,y}=LIGHT,lit=timeHour()>=18||timeHour()<6;c.save();c.translate(x,y);if(lit){let a=t*.35;c.save();c.rotate(a);let g=c.createLinearGradient(0,0,330,0);g.addColorStop(0,'#fff3aa88');g.addColorStop(1,'#fff3aa00');c.fillStyle=g;c.beginPath();c.moveTo(0,0);c.lineTo(330,-65);c.lineTo(330,65);c.closePath();c.fill();c.restore()}ellipse(c,0,25,30,13,'#5a6c6266');rr(c,-19,-18,38,42,5,'#e2dfc5');rr(c,-19,-8,38,11,2,'#a45750');rr(c,-17,-28,34,13,3,'#6c8585');rr(c,-15,-26,30,9,2,lit?'#fff0a0':'#3b5260');c.beginPath();c.moveTo(-22,-28);c.lineTo(0,-44);c.lineTo(22,-28);c.closePath();c.fillStyle='#9c4c47';c.fill();rr(c,-5,10,10,14,2,'#52615b');if(lit){let g=c.createRadialGradient(0,-21,3,0,-21,55);g.addColorStop(0,'#fff3aa88');g.addColorStop(1,'#fff3aa00');c.fillStyle=g;c.fillRect(-55,-76,110,110)}c.restore()}
function checkLighthouse(){if(!state.stats.farol&&Math.hypot(player.x-LIGHT.x,player.y-LIGHT.y)<340&&(timeHour()>=18||timeHour()<6)){state.stats.farol=1;addXP(30);save();toast('O Farol Abandonado está aceso...')}}
function drawWeather(c,t){let id=weatherNow().id;if(id==='clear')return;c.save();let tint={cloud:'#34495b20',rain:'#18384c28',storm:'#101b3866',fog:'#d4e5e43e',weird:'#67398233'}[id];c.fillStyle=tint;c.fillRect(0,0,view.w,view.h);if(id==='rain'||id==='storm'){c.strokeStyle=id==='storm'?'#cce9f280':'#dbf6f05c';c.lineWidth=1;for(let i=0;i<(state.graphics===0?25:75);i++){let x=(rnd(i+22)*view.w+t*90)%view.w,y=(rnd(i+677)*view.h+t*280)%view.h;c.beginPath();c.moveTo(x,y);c.lineTo(x-7,y+17);c.stroke()}if(id==='storm'&&Math.sin(t*.37)>.9995){c.fillStyle='#fff6cb55';c.fillRect(0,0,view.w,view.h)}}if(id==='fog'){for(let i=0;i<4;i++){let x=(rnd(i+5)*view.w+t*12)%(view.w+300)-150;let g=c.createRadialGradient(x,view.h*.35+i*45,20,x,view.h*.35+i*45,170);g.addColorStop(0,'#e6f2ef40');g.addColorStop(1,'#e6f2ef00');c.fillStyle=g;c.fillRect(x-170,0,340,view.h)}}if(id==='weird'){for(let i=0;i<25;i++)ellipse(c,rnd(i)*view.w,(rnd(i+99)*view.h+t*9)%view.h,2,2,'#dab4f999')}c.restore()}
normalize();ensureWaterPosition();ensureContracts();$('moreBtn').onclick=openMore;$('onlineBtn').onclick=openOnlineInfo;

// API boundary for a future server integration: catalog and tuning are separate from persisted profile.
// Server must independently validate location, timing, RNG, XP, currency, item ownership and idempotency.
const localGameAdapter={version:6,catalog:fish,probabilities,weatherNow,contractKey,levelInfo,save,normalize};
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});render();updateClock();requestAnimationFrame(frame);if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',initOnline,{once:true});else initOnline();
</script>
